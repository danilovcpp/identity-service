name: Identity CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/Identity.Admin.Web/package-lock.json
      - name: Repository secret guard
        shell: pwsh
        run: ./scripts/Test-RepositorySecrets.ps1 -SelfTest
      - run: dotnet restore Identity.slnx
      - run: dotnet tool restore
      - run: dotnet build Identity.slnx --configuration Release --no-restore
      - run: dotnet format Identity.slnx --no-restore --verify-no-changes
      - name: Frontend install, types, lint, formatting and component tests
        working-directory: src/Identity.Admin.Web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:run
          npx playwright install --with-deps chromium
      - name: Unit, API and PostgreSQL/Mailpit integration tests (includes migration Up/Down)
        run: dotnet test Identity.slnx --configuration Release --no-build --no-restore --logger "trx;LogFilePrefix=ci"
      - name: Migration model and SQL
        env:
          Database__ConnectionString: Host=localhost;Database=identity_design;Username=identity
        run: |
          dotnet ef migrations has-pending-model-changes --project src/Identity.Infrastructure --configuration Release --no-build
          dotnet ef migrations script --idempotent --project src/Identity.Infrastructure --configuration Release --no-build --output migration.sql
      - name: Container build and end-to-end smoke
        shell: pwsh
        run: ./scripts/Test-Stage7Smoke.ps1
      - name: Production Console images, OpenAPI, HTTPS boundary and complete browser suite
        shell: pwsh
        run: ./scripts/Test-AdminWebSmoke.ps1 -Production
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
