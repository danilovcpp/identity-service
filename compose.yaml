name: identity

services:
  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ConnectionString: Host=postgres;Port=5432;Database=identity;Username=identity;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Registration__Enabled: "true"
      Outbox__Enabled: "true"
      OutboxEncryption__ActiveKeyId: dev-outbox
      OutboxEncryption__Keys__dev-outbox: /run/secrets/identity_outbox_key
      Email__FromAddress: no-reply@identity.example
      Email__VerificationUrlTemplate: "${EMAIL_VERIFICATION_URL_TEMPLATE:?Set EMAIL_VERIFICATION_URL_TEMPLATE in .env}"
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: 1025
      Email__Smtp__Tls: None
    secrets:
      - identity_outbox_key
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:

secrets:
  identity_outbox_key:
    file: ${OUTBOX_KEY_FILE:-./secrets/outbox-dev.key}
