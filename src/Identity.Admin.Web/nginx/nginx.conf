worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    keepalive_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    geo $identity_admin_allowed {
        default 0;
        include /etc/nginx/admin-networks.conf;
    }
    map "$status:$uri" $identity_cache_control {
        default 'no-store';
        "~^200:/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(js|css)$" 'public, max-age=31536000, immutable';
    }
    map $uri $identity_csp {
        default "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests";
        ~*^/(api(?:/|$)|\.well-known/jwks\.json$) "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    }
    # This file is generated by the operator, never from request headers.
    include /etc/nginx/identity-host.conf;
    server {
        listen 127.0.0.1:8081;
        location = /health/live { return 200 'healthy'; }
        location / { return 404; }
    }
}
