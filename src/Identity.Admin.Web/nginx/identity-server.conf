ssl_certificate /run/secrets/identity_tls_certificate;
ssl_certificate_key /run/secrets/identity_tls_key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
root /usr/share/nginx/html;
add_header Strict-Transport-Security 'max-age=31536000' always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
add_header Content-Security-Policy $identity_csp always;
add_header Cache-Control $identity_cache_control always;

# Only existing content-hashed Vite assets are immutable.
# Entry documents are never cached. Ant Design requires runtime inline styles;
# portal scrollbar utilities do not propagate ConfigProvider's CSP nonce.
location ~ "^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
    try_files $uri =404;
}
location ~* ^/api/v1/admin(?:/|$) {
    if ($identity_admin_allowed = 0) { return 403; }
    include /etc/nginx/identity-proxy.conf;
}
location ~* ^/(api(?:/|$)|\.well-known/jwks\.json$) {
    include /etc/nginx/identity-proxy.conf;
}
location ~ ^/admin(?:/|$) {
    if ($identity_admin_allowed = 0) { return 403; }
    try_files $uri /index.html;
}
location ~ ^/account(?:/|$) { try_files $uri /index.html; }
location = /index.html {
    internal;
}
# Never turn an API 404, OpenAPI, health or arbitrary path into SPA HTML.
location / { return 404; }
